plugins { id 'com.android.application' }

def trustedCertificateSha256 = providers.gradleProperty('MVOLACASH_RELEASE_CERT_SHA256')
        .orElse(providers.environmentVariable('MVOLACASH_RELEASE_CERT_SHA256'))
        .getOrElse('')

android {
    namespace 'com.netk.mvolatrack'
    compileSdk 35

    defaultConfig {
        applicationId 'com.netk.mvolatrack'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'TRUSTED_APP_CERTIFICATE_SHA256',
                '"' + trustedCertificateSha256.replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            // Debug certificates are intentionally not trusted as official releases.
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
