name: Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.11.1"
      ANDROID_GRADLE_PLUGIN_VERSION: "8.9.2"
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK command-line tools
        run: sdkmanager --version

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle without wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Configure Android Gradle plugin version
        run: |
          cat > android-gradle-plugin.init.gradle <<'EOF_INIT'
          settingsEvaluated { settings ->
              settings.pluginManagement.resolutionStrategy.eachPlugin {
                  if (requested.id.id == "com.android.application") {
                      useVersion(System.getenv("ANDROID_GRADLE_PLUGIN_VERSION"))
                  }
              }
          }
          EOF_INIT

      - name: Build debug APK with Gradle
        run: gradle --init-script android-gradle-plugin.init.gradle assembleDebug --no-daemon --stacktrace

      - name: Locate generated APK
        id: apk
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk/**/*.apk" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
